name: build-apk

# Inputs are exactly the AppNivo contract (blueprint §9.1). All secret-bearing
# material is short-lived, single-purpose presigned URLs (ADR-07).
on:
  workflow_dispatch:
    inputs:
      buildJobId:        { required: true,  type: string }
      appId:             { required: true,  type: string }
      appName:           { required: true,  type: string }
      packageName:       { required: true,  type: string }
      versionName:       { required: false, type: string, default: "1.0.0" }
      versionCode:       { required: false, type: string, default: "1" }
      sourceUrl:         { required: true,  type: string }   # presigned GET, 2h
      sourceType:        { required: false, type: string, default: "ZIP" } # ZIP | GITHUB_TARBALL
      artifactUploadUrl: { required: true,  type: string }   # presigned PUT, 4h
      callbackUrl:       { required: true,  type: string }
      minSdk:            { required: false, type: string, default: "24" }
      targetSdk:         { required: false, type: string, default: "34" }

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.appId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_WEBHOOK_SECRET: ${{ secrets.BUILD_WEBHOOK_SECRET }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      BUILD_JOB_ID: ${{ inputs.buildJobId }}
      APP_ID: ${{ inputs.appId }}
      APP_NAME: ${{ inputs.appName }}
      PACKAGE_NAME: ${{ inputs.packageName }}
      VERSION_NAME: ${{ inputs.versionName }}
      VERSION_CODE: ${{ inputs.versionCode }}
      SOURCE_URL: ${{ inputs.sourceUrl }}
      SOURCE_TYPE: ${{ inputs.sourceType }}
      ARTIFACT_UPLOAD_URL: ${{ inputs.artifactUploadUrl }}
      CALLBACK_URL: ${{ inputs.callbackUrl }}
      MIN_SDK: ${{ inputs.minSdk }}
      TARGET_SDK: ${{ inputs.targetSdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # needed only for the callback helper
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Record build start
        run: echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Prepare release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-template/keystore.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/android-template/keystore.jks" >> "$GITHUB_ENV"
      - name: Fetch source
        id: fetch
        run: bash scripts/fetch-source.sh "${{ inputs.sourceUrl }}" "${{ inputs.sourceType }}"
      - name: Sanitize & extract
        id: sanitize
        run: bash scripts/sanitize-and-extract.sh "${{ inputs.sourceType }}"
      - name: Inject assets + manifest values
        id: inject
        run: node scripts/inject-assets.mjs
      - name: Build release APK
        id: gradle
        run: ./android-template/gradlew -p android-template assembleRelease
      - name: Compute artifact metadata
        id: meta
        run: bash scripts/artifact-meta.sh      # emits sha256, sizeBytes, apkPath
      - name: Upload build artifact (retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.buildJobId }}
          path: android-template/app/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: PUT artifact to AppNivo storage
        id: upload
        run: bash scripts/upload-artifact.sh "${{ inputs.artifactUploadUrl }}" "${{ steps.meta.outputs.apkPath }}"
      - name: Notify AppNivo (success)
        id: notify_success
        if: success()
        run: bash scripts/notify-callback.sh succeeded
      # Report a failure for any step except the success callback itself. If the
      # build succeeded but the success callback could not be delivered, we must
      # NOT re-report it as build.failed (it would mask a successful build).
      - name: Notify AppNivo (failure)
        if: ${{ failure() && steps.notify_success.outcome != 'failure' }}
        env:
          # Map the failing step to its build-engine error code (scripts may set
          # BUILD_FAILURE_CODE for finer-grained codes, e.g. PATH_TRAVERSAL).
          BUILD_ERROR_CODE: ${{ (steps.fetch.outcome == 'failure' && 'SOURCE_FETCH_FAILED') || (steps.sanitize.outcome == 'failure' && (env.BUILD_FAILURE_CODE || 'SOURCE_INVALID_ZIP')) || (steps.inject.outcome == 'failure' && 'UNKNOWN') || (steps.gradle.outcome == 'failure' && 'GRADLE_FAILED') || (steps.meta.outcome == 'failure' && 'UNKNOWN') || (steps.upload.outcome == 'failure' && 'ARTIFACT_UPLOAD_FAILED') || 'UNKNOWN' }}
          BUILD_ERROR_MESSAGE: ${{ env.BUILD_FAILURE_MESSAGE || '' }}
        run: bash scripts/notify-callback.sh failed
